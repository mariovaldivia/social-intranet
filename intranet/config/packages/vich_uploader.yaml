vich_uploader:
    db_driver: orm

    mappings:
        users:
           uri_prefix: /upload/users
           upload_destination: '%kernel.project_dir%/public/upload/users'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           inject_on_load: true
        # Photo gallery (App\Entity\Photo)
        gallery:
           uri_prefix: /upload/gallery
           upload_destination: '%kernel.project_dir%/public/upload/gallery'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

when@test:
    vich_uploader:
        mappings:
            # Keep test uploads out of public/upload
            gallery:
                uri_prefix: /upload/gallery
                upload_destination: '%kernel.project_dir%/var/test/upload/gallery'
                namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
