twig:
    file_name_pattern: '*.twig'
    form_themes: ['form/daisyui_layout.html.twig']
    # |date converts to this zone; pass false as the zone for date-only
    # columns (event date, birthdate) so they are not shifted a day
    date:
        timezone: '%app.timezone%'

when@test:
    twig:
        strict_variables: true
