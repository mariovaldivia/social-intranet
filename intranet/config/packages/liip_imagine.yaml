# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    twig:
        mode: lazy
    loaders:
        profile_photos:
            flysystem:
                filesystem_service: oneup_flysystem.profile_photos_filesystem
    data_loader: profile_photos
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    resolvers:
        default:
            web_path: ~
    filter_sets:
        cache: ~
        user:
            quality: 75
            filters:
                thumbnail: { size: [128, 128], mode: outbound }

        user_post:
            quality: 75
            filters:
                thumbnail: { size: [48, 48], mode: outbound }
        
        user_comment:
            quality: 75
            filters:
                thumbnail: { size: [32, 32], mode: outbound }

        # Photo gallery: square grid thumbnails and the lightbox image
        gallery_thumb:
            quality: 80
            filters:
                auto_rotate: ~
                thumbnail: { size: [400, 400], mode: outbound }

        gallery_large:
            quality: 85
            filters:
                auto_rotate: ~
                thumbnail: { size: [1600, 1600], mode: inset }
                